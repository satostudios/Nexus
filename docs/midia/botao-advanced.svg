<svg xmlns="http://www.w3.org/2000/svg" width="440" height="84" viewBox="0 0 440 84" role="img" aria-label="Quero o Nexus Advanced">
  <defs>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="436" height="80" rx="40"/></clipPath>
  </defs>
  <style>
    .s { animation: sweep 3.2s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 55%, 100% { transform: translateX(480px); } }
    .a { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translate(40px, 26px); } 50% { transform: translate(40px, 29px); } }
    @media (prefers-reduced-motion: reduce) { .s, .a { animation: none; } .s { opacity: 0; } }
  </style>
  <rect x="2" y="2" width="436" height="80" rx="40" fill="#0A0A0A" stroke="#B7A8FF" stroke-width="2"/>
  <g clip-path="url(#c)"><rect class="s" x="0" y="0" width="120" height="84" fill="url(#shine)" opacity=".35"/></g>
  <g class="a" transform="translate(40 26)" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27l2.2-6.4A11 11 0 1 1 12.5 25z"/><path d="M12.5 12.5c.6 3 3 5.4 6 6"/></g>
  <text x="86" y="41" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Quero o Nexus Advanced</text>
  <text x="86" y="63" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity=".62">Versão paga, com o Assistente de IA</text>
</svg>
