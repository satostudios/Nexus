<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Como instalar: 1 clique em baixar, 2 abra o arquivo na pasta Downloads, 3 instale, 4 escolha sua pasta e comece a usar">
  <style>
    .card { fill: #0A0A0A; stroke: #ffffff; stroke-opacity: .14; }
    .hl { fill: none; stroke: #ffffff; stroke-width: 2; opacity: 0; animation: hl 6.0s ease-in-out infinite; }
    @keyframes hl { 0% { opacity: 0; } 5% { opacity: 1; } 22% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
    .n { font: 600 12px 'Cascadia Mono', Consolas, 'Courier New', monospace; letter-spacing: .14em; fill: #8A8A8A; }
    .t { font: 700 19px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .s { font: 400 14px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #9A9AA0; }
    @media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="999" height="219" rx="24" fill="#050505" stroke="#ffffff" stroke-opacity=".1"/>
  <g>
    <rect x="20" y="20" width="225" height="180" rx="18" class="card"/>
    <rect x="20" y="20" width="225" height="180" rx="18" class="hl" style="animation-delay:0.00s"/>
    <text x="42" y="56" class="n">PASSO 1</text>
    <g transform="translate(42 74)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4v18M8 15l8 8 8-8M5 29h22"/></g>
    <text x="42" y="150" class="t">Clique em baixar</text>
    <text x="42" y="174" class="s">o download começa sozinho</text>
  </g>
  <g>
    <rect x="265" y="20" width="225" height="180" rx="18" class="card"/>
    <rect x="265" y="20" width="225" height="180" rx="18" class="hl" style="animation-delay:1.50s"/>
    <text x="287" y="56" class="n">PASSO 2</text>
    <g transform="translate(287 74)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a3 3 0 0 1 3-3h6l3 3h9a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M12 18h8M16 14v8"/></g>
    <text x="287" y="150" class="t">Abra o arquivo</text>
    <text x="287" y="174" class="s">na pasta Downloads</text>
  </g>
  <g>
    <rect x="510" y="20" width="225" height="180" rx="18" class="card"/>
    <rect x="510" y="20" width="225" height="180" rx="18" class="hl" style="animation-delay:3.00s"/>
    <text x="532" y="56" class="n">PASSO 3</text>
    <g transform="translate(532 74)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="22" height="22" rx="5"/><path d="m11 16.5 3.5 3.5 7-7.5"/></g>
    <text x="532" y="150" class="t">Instale</text>
    <text x="532" y="174" class="s">Avançar, Instalar, Concluir</text>
  </g>
  <g>
    <rect x="755" y="20" width="225" height="180" rx="18" class="card"/>
    <rect x="755" y="20" width="225" height="180" rx="18" class="hl" style="animation-delay:4.50s"/>
    <text x="777" y="56" class="n">PASSO 4</text>
    <g transform="translate(777 74)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5l2.8 7.4L26 13.3l-5.6 5 1.6 7.7L16 22.2 10 26l1.6-7.7L6 13.3l7.2-.9z"/></g>
    <text x="777" y="150" class="t">Escolha sua pasta</text>
    <text x="777" y="174" class="s">e comece a usar</text>
  </g>
</svg>
