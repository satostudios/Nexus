  <g class="a" transform="translate(40 26)" fill="none" stroke="#050505" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4v18M8 15l8 8 8-8M5 29h22"/></g>
  <text x="86" y="41" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#050505">Baixar o Nexus grátis</text>
  <text x="86" y="63" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#050505" fill-opacity=".62">Windows 10 e 11 · instalador de 130 MB</text>
