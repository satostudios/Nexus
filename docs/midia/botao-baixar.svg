<svg xmlns="http://www.w3.org/2000/svg" width="440" height="84" viewBox="0 0 440 84" role="img" aria-label="Baixar o Nexus grátis">
  <defs>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="436" height="80" rx="40"/></clipPath>
  </defs>
  <style>
    .s { animation: sweep 3.2s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 55%, 100% { transform: translateX(480px); } }
    .a { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translate(40px, 26px); } 50% { transform: translate(40px, 29px); } }
    @media (prefers-reduced-motion: reduce) { .s, .a { animation: none; } .s { opacity: 0; } }
  </style>
  <rect x="2" y="2" width="436" height="80" rx="40" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
